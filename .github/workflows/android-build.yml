name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

    - name: Run Unit Tests
      run: |
        # The FOSS fork build does not use Firebase; avoid applying the
        # Google Services plugin with the upstream package configuration.
        rm -f app/google-services.json
        chmod +x gradlew
        # Robolectric downloads its Android runtime artifacts from Maven during tests.
        # Retry the suite for transient Maven/network failures before failing the workflow.
        for attempt in 1 2 3; do
          if ./gradlew :core:testDebugUnitTest :lyrics:testDebugUnitTest :app:testUniversalFossDebugUnitTest; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "Unit tests failed on attempt $attempt; retrying after a short delay..."
            sleep 20
          fi
        done
        echo "Unit tests failed after 3 attempts."
        exit 1

    - name: Decode Keystore
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

    - name: Build Release APK
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleUniversalGmsRelease

    - name: Build Optimized FOSS Release APK (fallback signing)
      if: ${{ env.KEYSTORE_BASE64 == '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        mkdir -p "$HOME/.android"
        keytool -genkeypair \
          -keystore "$HOME/.android/debug.keystore" \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US" \
          -keyalg RSA \
          -validity 10000
        chmod +x gradlew
        ./gradlew assembleUniversalFossRelease

    - name: Upload Universal APK
      uses: actions/upload-artifact@v7
      with:
        name: Echo-Music-Universal-APK
        path: app/build/outputs/apk/**/*.apk
