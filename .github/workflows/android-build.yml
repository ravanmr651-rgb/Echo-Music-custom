name: Android CI

on:
  push:
    branches: [ "main", "aura-futuristic-upgrade" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

    - name: Cache Robolectric Android Runtime
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-runtime-4.14.1

    - name: Pre-fetch Robolectric Runtime
      run: |
        for ver in "13-robolectric-9030017-i7" "15-robolectric-12650502-i7"; do
          dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$ver"
          jar="$dir/android-all-instrumented-$ver.jar"
          if [ ! -f "$jar" ]; then
            mkdir -p "$dir"
            curl -fsSL --retry 5 --retry-delay 3 \
              "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$ver/android-all-instrumented-$ver.jar" \
              -o "$jar" || true
          fi
        done

    - name: Run Unit Tests
      run: |
        # The FOSS fork build does not use Firebase; avoid applying the
        # Google Services plugin with the upstream package configuration.
        rm -f app/google-services.json
        chmod +x gradlew
        ./gradlew :core:testDebugUnitTest :lyrics:testDebugUnitTest :app:testUniversalFossDebugUnitTest

    # Release signing secrets are checked only on trusted main-branch runs.
    # Pull requests run tests but never receive or use private signing material.
    - name: Check persistent release signing secrets
      id: signing
      if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Persistent release signing is configured." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Release APK not built"
            echo "The persistent signing key is not configured. Add the four repository Actions secrets described in [docs/RELEASE_SIGNING.md](https://github.com/ravanmr651-rgb/Echo-Music-custom/blob/main/docs/RELEASE_SIGNING.md), then run this workflow on `main`."
            echo "No temporary/debug-signed release APK will be produced."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Persistent release signing secrets are missing; skipping distributable APK build."
        fi

    - name: Decode and validate persistent keystore
      if: ${{ steps.signing.outputs.configured == 'true' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
        chmod 600 keystore.jks
        keytool -list -keystore keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
        echo "Persistent keystore decoded and alias validated." >> "$GITHUB_STEP_SUMMARY"

    - name: Build signed Universal FOSS APK
      if: ${{ steps.signing.outputs.configured == 'true' }}
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleUniversalFossRelease

    - name: Upload signed Universal FOSS APK
      if: ${{ steps.signing.outputs.configured == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: AURA-Music-Universal-FOSS-APK
        path: app/build/outputs/apk/universalFoss/release/*.apk
        if-no-files-found: error
        retention-days: 30
